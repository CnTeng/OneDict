name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Validate release version
        run: |
          node --input-type=module <<'EOF'
          import pkg from './package.json' with { type: 'json' };
          if (!/^\d+\.\d+\.\d+$/.test(pkg.version) || process.env.GITHUB_REF_NAME !== `v${pkg.version}`) {
            throw new Error('Release tag must match the stable package.json version: v<major>.<minor>.<patch>');
          }
          EOF

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Package all platforms
        run: npm run package

      - name: Publish release and update manifest
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/onedict-chrome-v*.zip
            dist/onedict-firefox-v*.xpi
            dist/onedict-zotero-v*.xpi
            dist/update.json
